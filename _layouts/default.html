<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#e01b1b">

  {%- seo -%}
</head>
<body>
  <main class="holding">
    {%- assign image = page.image | default: site.image -%}
    {%- if image -%}
      <img class="holding__image"
           src="{{ image | relative_url }}"
           alt="{{ page.image_alt | default: site.title | escape }}">
    {%- endif -%}

    <h1 class="holding__title">{{ page.title | default: site.title }}</h1>

    <div class="holding__text">
      {{ content }}
    </div>

    {%- if site.instagram -%}
      <nav class="holding__social">
        <a class="roundel"
           href="https://www.instagram.com/{{ site.instagram }}/"
           rel="me noopener"
           target="_blank"
           aria-label="{{ site.title | escape }} on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5.5"/>
            <circle cx="12" cy="12" r="4.25"/>
            <circle cx="17.1" cy="6.9" r="1.15" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </nav>
    {%- endif -%}

    {%- if site.email -%}
      <p class="holding__contact">
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </p>
    {%- endif -%}
  </main>
</body>
</html>
