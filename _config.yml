title: One Cross Baker
description: >-
  Baking in Forest Gate, London.
url: "https://www.onecrossbaker.co.uk"
baseurl: ""

# Uncomment to show a contact address under the paragraph.
# email: you@example.com

# Instagram handle only — the layout builds the profile URL.
instagram: onecrossbaker

# Site-wide default image. index.md can override it with its own `image:`.
image: /assets/images/holding.jpg

# No theme gem — the whole site is _layouts/default.html + assets/css/style.css.

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
